# Nginx vhost for live-qr.wemeshup.com — reverse proxy with WebSocket upgrade.
# Place at /etc/nginx/sites-available/live-qr.conf on the nginx VM (e.g. 10.10.10.10),
# symlink into /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Adjust the upstream IP if the app VM is somewhere other than 10.10.10.20.

upstream live_qr_app {
    server 10.10.10.20:8000;
    keepalive 32;
}

# HTTP — used for the ACME (Let's Encrypt) challenge and to redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name live-qr.wemeshup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminates TLS, proxies to the app, upgrades the WebSocket for /ws/*.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live-qr.wemeshup.com;

    ssl_certificate     /etc/letsencrypt/live/live-qr.wemeshup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-qr.wemeshup.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The frontend POSTs JPEG-encoded webcam frames. Tune this if you bump the resolution.
    client_max_body_size 25m;

    # Mostly useful so chunked WebSocket streams don't get capped on hefty events.
    proxy_buffering off;

    location / {
        proxy_pass http://live_qr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/detect.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
